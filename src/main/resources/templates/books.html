<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>NovelNest</title>
</head>
<body>

<h1>NovelNest</h1>

<div th:each="book : ${books}">

    <h3 th:text="${book.title}"></h3>

    <p>
        Author:
        <span th:text="${book.author}"></span>
    </p>

    <a th:href="@{/pdf/{file}(file=${book.pdfPath})}">
        Read Book
    </a>
    <hr>

</div>

</body>
</html>
